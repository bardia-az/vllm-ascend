[build-system]
# Should be mirrored in requirements.txt
requires = [
    "attrs",
    "cmake>=3.26",
    "decorator",
    "einops",
    "googleapis-common-protos",
    "numpy",
    "packaging",
    "pip",
    "pybind11",
    "pyyaml",
    "scipy",
    "pandas",
    "pandas-stubs",
    "psutil",
    "setuptools>=64",
    "setuptools-scm>=8",
    "transformers==5.14.1",
    "torch-npu==2.10.0.post4; platform_machine == 'aarch64'",
    "torch==2.10.0; platform_machine == 'aarch64'",
    "torchvision; platform_machine == 'aarch64'",
    "wheel",
    "msgpack",
    "quart",
    "numba",
    "xgrammar>=0.1.30",
    "fastapi<0.124.0",
    "fastokens==0.2.0",
    "compressed_tensors>=0.11.0",
    "arctic-inference==0.1.1",
    "memfabric-hybrid==1.3.0",
    "memcache-hybrid==1.3.0",
    "triton-ascend==3.6.0.post2; platform_machine == 'aarch64'"
]
build-backend = "setuptools.build_meta"

# PEP 621 metadata added in this fork so the package can be a uv workspace
# member (uv requires a [project] table). Fields declared here were removed
# from setup() in setup.py to avoid setuptools double-specification errors;
# everything else still comes from setup.py. Dependencies stay sourced from
# requirements.txt as the single pin file.
[project]
name = "vllm_ascend"
version = "0.30.0"
description = "vLLM Ascend backend plugin"
# setuptools' PEP 621 reader crashes on a missing readme key (_long_description
# does None.get) — this line is required, not cosmetic.
readme = "README.md"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv.extra-build-dependencies]
pandas = ["setuptools<72"]

[tool.pymarkdown]
plugins.md004.style = "sublist" # ul-style
plugins.md007.indent = 4 # ul-indent
plugins.md007.start_indented = true # ul-indent
plugins.md013.enabled = false # line-length
plugins.md041.enabled = false # first-line-h1
plugins.md033.enabled = false # inline-html
plugins.md046.enabled = false # code-block-style
plugins.md024.allow_different_nesting = true # no-duplicate-headers
plugins.md029.enabled = false # ol-prefix

[tool.ruff]
# TODO: according to PEP8, there should be 120 characters per line
line-length = 120
# Folder to be modified
exclude = []

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    "B904",
    "SIM108",
    "SIM102"
]
logger-objects = ["vllm.logger.logger"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
markers = [
    "e2e_model: E2E test model identifier(s)",
    "e2e_coverage: E2E test coverage dimensions (arch, feature, parallel, deploy, hardware, quantization, graph_mode)",
]
